services:
  db:
    image: postgres:17-alpine
    container_name: sandook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandook
      POSTGRES_USER: sandook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandook-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - sandook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandook -d sandook"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sandook-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sandook
      SPRING_DATASOURCE_USERNAME: sandook
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sandook-dev-password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-sandook-dev-secret-change-me-before-prod-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: sandook-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"

volumes:
  sandook-pgdata:
