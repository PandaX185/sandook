name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (static export)
        run: npm run build
        working-directory: frontend
        env:
          NEXT_EXPORT: "true"

      - name: Copy frontend to backend resources
        run: |
          rm -rf backend/src/main/resources/static
          cp -r frontend/out backend/src/main/resources/static

      - name: Build backend JAR (tests skipped — run separately)
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./mvnw.cmd -DskipTests package -Pembedded
          else
            ./mvnw -DskipTests package -Pembedded
          fi
        working-directory: backend

      - name: Verify JAR exists
        run: ls -lh backend/target/sandook.jar

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create jpackage app-image
        run: |
          jpackage \
            --type app-image \
            --name Sandook \
            --app-version "${{ steps.version.outputs.version }}" \
            --dest dist \
            --input backend/target \
            --main-jar sandook.jar \
            --java-options "-Xmx512m -Dspring.profiles.active=embedded" \
            --description "Sandook — Cash box ledger" \
            --vendor "AL-EMAD AL SHAER"
          echo "--- jpackage output ---"
          find dist -maxdepth 2 -type f -o -type d | head -20

      - name: Package app-image
        run: |
          cd dist
          ls -la
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "sandook-${{ steps.version.outputs.version }}-${{ runner.os }}.zip" Sandook/
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            tar -czf "sandook-${{ steps.version.outputs.version }}-${{ runner.os }}.tar.gz" Sandook/
          else
            tar -czf "sandook-${{ steps.version.outputs.version }}-${{ runner.os }}.tar.gz" Sandook/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandook-${{ runner.os }}
          path: dist/sandook-*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
