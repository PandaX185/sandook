spring.application.name=sandook-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5433/sandook
spring.datasource.username=sandook
spring.datasource.password=${POSTGRES_PASSWORD:sandook-dev-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT (override JWT_SECRET in production!) ---
sandook.jwt.secret=${JWT_SECRET:sandook-dev-secret-change-me-before-prod-0123456789abcdef}
sandook.jwt.access-ttl-minutes=15
sandook.jwt.refresh-ttl-days=30

# --- Bootstrap admin (created only when the users table is empty) ---
sandook.admin.username=${ADMIN_USERNAME:admin}
sandook.admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
