# ─── Embedded desktop mode ────────────────────────────────
# Activated via: java -jar app.jar --spring.profiles.active=embedded
# Uses H2 file-based DB (PostgreSQL compatibility) — no Docker needed.

spring.datasource.url=jdbc:h2:file:${user.home}/.sandook/sandook;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flyway is disabled in embedded mode — Hibernate handles schema via ddl-auto=update.
spring.flyway.enabled=false

# ─── JWT ──────────────────────────────────────────────────
sandook.jwt.secret=${JWT_SECRET:sandook-embedded-secret-do-not-use-in-prod}
sandook.jwt.access-ttl-minutes=1440
sandook.jwt.refresh-ttl-days=90

# ─── Bootstrap admin ──────────────────────────────────────
# Created automatically when the users table is empty.
sandook.admin.username=${ADMIN_USERNAME:admin}
sandook.admin.password=${ADMIN_PASSWORD:admin123}

# ─── CORS (same-origin — no cross-origin requests) ────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ─── Server ───────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ─── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
